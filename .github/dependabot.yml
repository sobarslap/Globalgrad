version: 2
# Dependabot version updates are DISABLED: open-pull-requests-limit is 0 for
# every ecosystem, so no automated dependency PRs are opened. The grouping and
# ignore rules below are kept so updates can be re-enabled later by restoring a
# non-zero limit (e.g. 5). NOTE: this only turns off scheduled *version* update
# PRs — Dependabot *security* alerts/updates are governed by the repository's
# Code security settings, not this file.
updates:
  # npm dependencies — disabled (limit 0). Grouped config retained for re-enable.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # Block breaking MAJOR bumps for deliberately pinned toolchain packages
    # (Prisma is pinned to 6 — 7 needs prisma.config.ts + a driver adapter; the
    # TS/ESLint/@types/node majors also broke the Vercel build). Minor and patch
    # updates for these still flow normally.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in CI — disabled (limit 0).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
