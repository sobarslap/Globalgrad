name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Installs deps and runs the `postinstall` (prisma generate), so the
      # generated client types are available for typecheck. No database needed.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Fail the build on known high/critical advisories in the dep tree.
      - name: Security audit
        run: npm audit --audit-level=high
